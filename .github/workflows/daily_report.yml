name: Daily Stock Report Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = KST 08:00

permissions:
  contents: read

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secrets 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY secret 누락" && exit 1)
          test -n "$SLACK_WEBHOOK_URL" || (echo "SLACK_WEBHOOK_URL secret 누락" && exit 1)
          echo "Secrets 확인 완료"

      - name: Import 확인
        run: |
          python -c "
          from collectors.market import fetch_market_quotes
          from collectors.dart import fetch_financial_highlights
          from collectors.news import fetch_news_items
          from report.generator import extract_facts
          print('import ok')
          "

      - name: 시세 수집 스모크 테스트
        run: |
          python -c "
          from collectors.market import ensure_market_data_prefetched, fetch_market_quotes, fetch_watchlist_trends
          ensure_market_data_prefetched()
          quotes = fetch_market_quotes()
          trends = fetch_watchlist_trends()
          q_ok = sum(1 for q in quotes if q.price is not None)
          t_ok = sum(1 for t in trends if t.price is not None)
          print(f'시세 스모크: quotes {q_ok}/{len(quotes)}, trends {t_ok}/{len(trends)}')
          if q_ok < 6:
              print('경고: 시장 지수 수집률 낮음')
          if t_ok < 5:
              print('경고: 워치리스트 수집률 낮음')
          "

      - name: 파이썬 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
        run: python main.py
